name: Release
on:
  push:
    tags: ['v*.*.*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

      - name: Check tag matches versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$TAG" != "$NAME" ]; then
            echo "::error::Tag v$TAG does not match versionName $NAME in app/build.gradle.kts"; exit 1
          fi
          echo "VERSION=$NAME" >> "$GITHUB_ENV"

      - name: Check changelog entry
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1
          fi

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MEALFORGE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. See RELEASING.md."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MEALFORGE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Test
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed APK and bundle
        env:
          MEALFORGE_KEYSTORE_PASSWORD: ${{ secrets.MEALFORGE_KEYSTORE_PASSWORD }}
          MEALFORGE_KEY_ALIAS: ${{ secrets.MEALFORGE_KEY_ALIAS }}
          MEALFORGE_KEY_PASSWORD: ${{ secrets.MEALFORGE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signing.txt
          grep -q "Signer #1 certificate SHA-256" signing.txt

      - name: Collect artifacts
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MealForge-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/MealForge-$VERSION.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          {
            cat release-notes.md
            echo
            echo "### Install"
            echo "Download \`MealForge-$VERSION.apk\` on your Android phone (Android 10 or newer) and open it. See the README for update notes."
            echo
            echo "Signing certificate SHA-256: \`$(sed -n 's/.*SHA-256 digest: //p' signing.txt | head -1)\`"
          } > release-body.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in 0.*|*-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "MealForge $VERSION" --notes-file release-body.md $PRE

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
